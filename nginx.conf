# Bank Slip Reader API - Nginx Configuration
# Add this to your nginx configuration file

server {
    listen 80;
    server_name readqrcode.iceiy.com;
    root /path/to/your/public_html;  # Change this to your actual path

    # Security headers
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type, Authorization";

    # Handle preflight OPTIONS requests
    location / {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }

        # Try to serve static files first, then API, then fallback to index.html
        try_files $uri $uri/ /api/index.php?$args /index.html;
    }

    # API routing - route all /api/* requests to PHP
    location /api/ {
        try_files $uri $uri/ /api/index.php?$args;

        # Handle PHP files in API folder
        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.1-fpm.sock;  # Adjust PHP version as needed
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Handle direct PHP file access
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;  # Adjust PHP version as needed
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
    }

    # Security: prevent access to sensitive files
    location ~ (\.htaccess|\.htpasswd|\.ini|\.log|\.sh|\.inc|\.bak)$ {
        deny all;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

